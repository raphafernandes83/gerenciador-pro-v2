<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff7a1a;
    --orange-2: #ff9e4d;
    --text: #f7f8fb;
    --muted: #aeb9c8;
    --muted-2: #93a0b1;
    --line: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    color: var(--text);
    background:
      radial-gradient(circle at 88% 4%, rgba(255,122,26,.10), transparent 32%),
      radial-gradient(circle at 4% 60%, rgba(55,103,255,.10), transparent 34%),
      linear-gradient(160deg, #06080d 0%, #090e16 46%, #05070b 100%);
    font-family: Inter, Arial, sans-serif;
    padding: 52px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .grid {
    position: absolute;
    inset: 0;
    opacity: .16;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, black, transparent 78%);
  }
  .layer { position: relative; z-index: 1; }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 15px; }
  .mark {
    width: 52px; height: 52px;
    display: grid; place-items: center;
    border-radius: 15px;
    color: #101010;
    background: linear-gradient(145deg, var(--orange), var(--orange-2));
    box-shadow: 0 14px 30px rgba(255,122,26,.28), inset 0 1px 0 rgba(255,255,255,.45);
    font-family: Manrope, sans-serif;
    font-size: 19px; font-weight: 800;
  }
  .brand-copy strong { display: block; font-size: 21px; letter-spacing: -.02em; }
  .brand-copy span { display: block; margin-top: 3px; color: var(--muted-2); font-size: 13px; letter-spacing: .05em; }
  .tag {
    display: inline-flex; align-items: center; gap: 9px;
    color: var(--orange-2);
    font-size: 12px; font-weight: 800; letter-spacing: .16em;
  }
  .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 5px rgba(255,122,26,.12); }

  .lead {
    font-family: Manrope, sans-serif;
    font-size: 34px; font-weight: 700; letter-spacing: -.03em;
    line-height: 1.15;
  }
  .lead em { font-style: normal; color: var(--muted); }

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
  .stat { display: flex; flex-direction: column; gap: 12px; }
  .num {
    font-family: Manrope, sans-serif;
    font-size: 108px; font-weight: 800;
    letter-spacing: -.055em; line-height: .88;
    font-variant-numeric: tabular-nums;
  }
  .stat.bad .num { color: var(--muted-2); }
  .stat.good .num { color: var(--orange-2); }
  .who { font-size: 19px; font-weight: 700; }
  .stat.bad .who { color: var(--muted); }
  .track { display: block; height: 14px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .fill { display: block; height: 100%; border-radius: 3px; }
  .stat.bad .fill { width: 35.4%; background: var(--muted-2); }
  .stat.good .fill { width: 49.3%; background: var(--orange); }

  footer {
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted-2);
    font-size: 14px;
    letter-spacing: .01em;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <header class="layer">
    <div class="brand">
      <span class="mark">GP</span>
      <span class="brand-copy">
        <strong>Gerenciador PRO</strong>
        <span>TRADING MANAGEMENT SYSTEM</span>
      </span>
    </div>
    <span class="tag"><i></i>PRÉ-LANÇAMENTO</span>
  </header>

  <p class="lead layer">
    Sessões que batem a meta,<br>
    <em>operando com 50% de acerto.</em>
  </p>

  <div class="duo layer">
    <div class="stat bad">
      <span class="num">35%</span>
      <span class="who">Entrada fixa</span>
      <span class="track"><span class="fill"></span></span>
    </div>
    <div class="stat good">
      <span class="num">49%</span>
      <span class="who">Gerenciador PRO</span>
      <span class="track"><span class="fill"></span></span>
    </div>
  </div>

  <footer class="layer">
    Banca $10.000 · entrada 2% · meta +10% · stop −15% · payout 87% · 200.000 sessões
  </footer>
</body>
</html>
