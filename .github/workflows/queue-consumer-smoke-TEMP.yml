name: TEMP Queue consumer smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/queue-consumer-smoke-TEMP.yml"
      - "wrangler.queue-consumer-preview.jsonc"
      - "src/worker.js"
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/queue-consumer-smoke-TEMP.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
      QUEUE_ID: 7f6abeea1385470490a85aaf4d4ca1ba
      CONSUMER_NAME: gerenciador-pro-sheet-retry-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-foundation

      - name: Validar JavaScript e config
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          jq -e '.name == "gerenciador-pro-sheet-retry-preview"' wrangler.queue-consumer-preview.jsonc >/dev/null
          jq -e '.queues.consumers[0].max_concurrency == 1' wrangler.queue-consumer-preview.jsonc >/dev/null
          jq -e '.queues.consumers[0].dead_letter_queue == "gerenciador-pro-sheet-retry-dlq"' wrangler.queue-consumer-preview.jsonc >/dev/null

      - name: Implantar consumidor isolado
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.queue-consumer-preview.jsonc
          echo "PASS: consumidor isolado implantado"

      - name: Confirmar consumer binding na Queue
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/consumers"
          response=$(curl --fail-with-body -sS "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          id=$(jq -r --arg script "$CONSUMER_NAME" '.result[]? | select(.script_name == $script) | .consumer_id' <<<"$response" | head -n1)
          test -n "$id" && test "$id" != "null"
          echo "consumer_id=$id" >> "$GITHUB_ENV"
          echo "PASS: Queue ligada ao consumidor isolado"

      - name: Preparar lead retry sintetico no D1
        id: lead
        shell: bash
        run: |
          set -euo pipefail
          submission_id="consumer-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          payload_json=$(jq -nc --arg id "$submission_id" '{submission_id:$id,tipo_interesse:"comprar",nome:"TESTE CHATGPT — PODE APAGAR",whatsapp:"+5521900000000",email:"teste.gerenciador.pro.20260819@example.com",pais:"Brazil",consentimento:"Sim",origem:"ci-consumer-smoke"}')
          sql="INSERT INTO leads (submission_id,tipo_interesse,nome,whatsapp,whatsapp_norm,email,email_norm,pais,consentimento,origem,payload_json,sheet_sync_status) VALUES (?,?,?,?,?,?,?,?,?,?,?,'retry')"
          params=$(jq -nc --arg id "$submission_id" --arg payload "$payload_json" '[ $id,"comprar","TESTE CHATGPT — PODE APAGAR","+5521900000000","5521900000000","teste.gerenciador.pro.20260819@example.com","teste.gerenciador.pro.20260819@example.com","Brazil",1,"ci-consumer-smoke",$payload ]')
          body=$(jq -nc --arg sql "$sql" --argjson params "$params" '{sql:$sql,params:$params}')
          response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "PASS: lead retry sintetico preparado"

      - name: Enviar mensagem para Queue
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.lead.outputs.submission_id }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/messages"
          body=$(jq -nc --arg id "$SUBMISSION_ID" '{body:{type:"sheet_mirror_retry",submissionId:$id,reason:"ci_consumer_smoke",queuedAt:"now"},content_type:"json",delay_seconds:0}')
          response=$(curl --fail-with-body -sS -X POST "$url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$body")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          echo "PASS: mensagem enviada"

      - name: Confirmar Queue consumer -> Sheets -> D1
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.lead.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for attempt in $(seq 1 40); do
            sql="SELECT l.sheet_sync_status, l.sheet_sync_attempts, EXISTS(SELECT 1 FROM system_events e WHERE e.submission_id=l.submission_id AND e.event_type='sheet_retry_consumer_succeeded') AS consumer_ok FROM leads l WHERE l.submission_id=? LIMIT 1"
            body=$(jq -nc --arg id "$SUBMISSION_ID" --arg sql "$sql" '{sql:$sql,params:[$id]}')
            response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
            status=$(jq -r '.result[0].results[0].sheet_sync_status // empty' <<<"$response")
            consumer_ok=$(jq -r '.result[0].results[0].consumer_ok // 0' <<<"$response")
            echo "attempt=${attempt} status=${status} consumer_ok=${consumer_ok}"
            if [ "$status" = "synced" ] && [ "$consumer_ok" = "1" ]; then
              echo "PASS: Queue consumer sincronizou Sheets e confirmou no D1"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Limpar D1 sintetico
        if: always() && steps.lead.outputs.submission_id != ''
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.lead.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for sql in "DELETE FROM system_events WHERE submission_id = ?" "DELETE FROM leads WHERE submission_id = ?"; do
            body=$(jq -nc --arg id "$SUBMISSION_ID" --arg sql "$sql" '{sql:$sql,params:[$id]}')
            response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
            test "$(jq -r '.success // false' <<<"$response")" = "true"
          done
          echo "PASS: D1 sintetico limpo"

      - name: Desconectar consumidor temporario
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/consumers"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          response=$(curl --fail-with-body -sS "$base" -H "$auth")
          id=$(jq -r --arg script "$CONSUMER_NAME" '.result[]? | select(.script_name == $script) | .consumer_id' <<<"$response" | head -n1)
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            deleted=$(curl --fail-with-body -sS -X DELETE "${base}/${id}" -H "$auth")
            test "$(jq -r '.success // false' <<<"$deleted")" = "true"
          fi
          echo "PASS: consumidor temporario desconectado da Queue"

      - name: Tentar remover Worker temporario
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          npx --yes wrangler@latest delete --config wrangler.queue-consumer-preview.jsonc --name "$CONSUMER_NAME" </dev/null || true
