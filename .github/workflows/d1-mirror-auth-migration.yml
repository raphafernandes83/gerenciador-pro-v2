name: D1 mirror auth migration

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/d1-mirror-auth-migration.yml"
      - "migrations/0003_mirror_auth_token.sql"
  push:
    branches: ["infra/cloudflare-foundation"]
    paths:
      - ".github/workflows/d1-mirror-auth-migration.yml"
      - "migrations/0003_mirror_auth_token.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-schema-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
    steps:
      - name: Aplicar coluna somente se ausente
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          query() {
            local sql="$1" body
            body=$(jq -nc --arg sql "$sql" '{sql:$sql,params:[]}')
            curl --fail-with-body -sS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' --data "$body"
          }
          schema=$(query "SELECT COUNT(*) AS n FROM pragma_table_info('leads') WHERE name='mirror_auth_token'")
          present=$(jq -r '.result[0].results[0].n // 0' <<<"$schema")
          if [ "$present" -eq 0 ]; then
            response=$(query "ALTER TABLE leads ADD COLUMN mirror_auth_token TEXT")
            test "$(jq -r '.success // false' <<<"$response")" = true
            echo 'PASS: mirror_auth_token adicionado'
          else
            echo 'PASS: mirror_auth_token já existe'
          fi

      - name: Instalar triggers de segurança
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          run_sql() {
            local sql="$1" body response
            body=$(jq -nc --arg sql "$sql" '{sql:$sql,params:[]}')
            response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' --data "$body")
            test "$(jq -r '.success // false' <<<"$response")" = true
          }

          run_sql "CREATE TRIGGER IF NOT EXISTS trg_lead_mirror_token_insert AFTER INSERT ON leads WHEN NEW.sheet_sync_status IN ('pending','retry') AND COALESCE(NEW.mirror_auth_token,'')='' BEGIN UPDATE leads SET mirror_auth_token=lower(hex(randomblob(32))) WHERE id=NEW.id; END"
          run_sql "CREATE TRIGGER IF NOT EXISTS trg_lead_mirror_token_active AFTER UPDATE OF sheet_sync_status ON leads WHEN NEW.sheet_sync_status IN ('pending','retry') AND COALESCE(NEW.mirror_auth_token,'')='' BEGIN UPDATE leads SET mirror_auth_token=lower(hex(randomblob(32))) WHERE id=NEW.id; END"
          run_sql "CREATE TRIGGER IF NOT EXISTS trg_lead_sync_terminal BEFORE UPDATE OF sheet_sync_status ON leads WHEN OLD.sheet_sync_status='synced' AND NEW.sheet_sync_status<>'synced' BEGIN SELECT RAISE(ABORT,'synced_is_terminal'); END"
          run_sql "CREATE TRIGGER IF NOT EXISTS trg_lead_mirror_token_synced AFTER UPDATE OF sheet_sync_status ON leads WHEN NEW.sheet_sync_status='synced' AND NEW.mirror_auth_token IS NOT NULL BEGIN UPDATE leads SET mirror_auth_token=NULL WHERE id=NEW.id; END"
          echo 'PASS: triggers de capability token instalados'

      - name: Backfill seguro de estados atuais
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for sql in \
            "UPDATE leads SET mirror_auth_token=lower(hex(randomblob(32))) WHERE sheet_sync_status IN ('pending','retry') AND COALESCE(mirror_auth_token,'')=''" \
            "UPDATE leads SET mirror_auth_token=NULL WHERE sheet_sync_status='synced' AND mirror_auth_token IS NOT NULL"; do
            body=$(jq -nc --arg sql "$sql" '{sql:$sql,params:[]}')
            response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' --data "$body")
            test "$(jq -r '.success // false' <<<"$response")" = true
          done
          echo 'PASS: tokens compatibilizados com estado de sync'

      - name: Verificar invariantes sem ler PII
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          sql="SELECT (SELECT COUNT(*) FROM pragma_table_info('leads') WHERE name='mirror_auth_token') AS column_ok, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_lead_mirror_token_insert','trg_lead_mirror_token_active','trg_lead_sync_terminal','trg_lead_mirror_token_synced')) AS trigger_count, COALESCE(SUM(CASE WHEN sheet_sync_status IN ('pending','retry') AND COALESCE(mirror_auth_token,'')='' THEN 1 ELSE 0 END),0) AS missing_active_token, COALESCE(SUM(CASE WHEN sheet_sync_status='synced' AND mirror_auth_token IS NOT NULL THEN 1 ELSE 0 END),0) AS synced_with_token FROM leads"
          body=$(jq -nc --arg sql "$sql" '{sql:$sql,params:[]}')
          response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' --data "$body")
          row=$(jq -c '.result[0].results[0]' <<<"$response")
          echo "column=$(jq -r '.column_ok' <<<"$row") triggers=$(jq -r '.trigger_count' <<<"$row") missing=$(jq -r '.missing_active_token' <<<"$row") synced_token=$(jq -r '.synced_with_token' <<<"$row")"
          test "$(jq -r '.column_ok // 0' <<<"$row")" -eq 1
          test "$(jq -r '.trigger_count // 0' <<<"$row")" -eq 4
          test "$(jq -r '.missing_active_token // 0' <<<"$row")" -eq 0
          test "$(jq -r '.synced_with_token // 0' <<<"$row")" -eq 0
          echo 'PASS: mirror auth token invariants'
