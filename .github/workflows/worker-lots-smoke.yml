name: Worker lots smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/worker-lots-smoke.yml"
      - "src/lots.js"
      - "src/worker-entry.js"
      - "wrangler.jsonc"
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/worker-lots-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
      PREVIEW_URL: https://infra-cloudflare-foundation-gerenciador-pro-v2.animaisfofinhos1983.workers.dev
      TEST_EMAIL: teste.gerenciador.pro.20260819@example.com
    steps:
      - name: Aguardar endpoint de lotes
        shell: bash
        env:
          MARKET: ci-worker-lot-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/lots.json -w '%{http_code}' "${PREVIEW_URL}/api/lots?market=${MARKET}" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/lots.json >/dev/null 2>&1; then
              echo "PASS: /api/lots disponivel"
              exit 0
            fi
            echo "Aguardando preview (${attempt}/60)"
            sleep 5
          done
          exit 1

      - name: Preparar lote temporario
        shell: bash
        env:
          MARKET: ci-worker-lot-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for sql in \
            "DELETE FROM system_events WHERE submission_id IN (SELECT submission_id FROM leads WHERE email_norm = ?)" \
            "DELETE FROM lead_lot_allocations WHERE submission_id IN (SELECT submission_id FROM leads WHERE email_norm = ?)" \
            "DELETE FROM leads WHERE email_norm = ?"; do
            body=$(jq -nc --arg sql "$sql" --arg email "$TEST_EMAIL" '{sql:$sql,params:[$email]}')
            response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
            test "$(jq -r '.success // false' <<<"$response")" = "true"
          done
          body=$(jq -nc --arg market "$MARKET" '{sql:"DELETE FROM registration_lots WHERE market_key = ?",params:[$market]}')
          curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body" >/dev/null
          sql="INSERT INTO registration_lots (market_key,lot_number,label,capacity,claimed_count,price_minor,currency_code,state,display_order,opened_at) VALUES (?,1,'CI WORKER LOT',2,0,7900,'BRL','open',1,strftime('%Y-%m-%dT%H:%M:%fZ','now'))"
          body=$(jq -nc --arg sql "$sql" --arg market "$MARKET" '{sql:$sql,params:[$market]}')
          response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          echo "PASS: lote temporario criado"

      - name: Confirmar 2 vagas antes do cadastro
        shell: bash
        env:
          MARKET: ci-worker-lot-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS "${PREVIEW_URL}/api/lots?market=${MARKET}")
          jq -e '.ok == true and .configured == true and .current.remaining == 2 and .current.priceMinor == 7900 and .current.currency == "BRL"' <<<"$response" >/dev/null
          echo "PASS: contador inicial = 2"

      - name: Cadastrar e reservar uma vaga
        id: register
        shell: bash
        env:
          MARKET: ci-worker-lot-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          submission_id="worker-lot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(jq -nc --arg id "$submission_id" --arg market "$MARKET" '{submission_id:$id,tipo_interesse:"comprar",nome:"TESTE CHATGPT — PODE APAGAR",whatsapp:"+5521900000000",email:"teste.gerenciador.pro.20260819@example.com",pais:$market,consentimento:"Sim",origem:"ci-worker-lot"}')
          response=$(curl --fail-with-body -sS -X POST "${PREVIEW_URL}/api/register" -H "Content-Type: application/json" --data "$payload")
          jq -e --arg id "$submission_id" '.ok == true and .duplicate == false and .submissionId == $id and .lotStatus == "allocated" and .lot.remaining == 1 and .lot.priceMinor == 7900 and .lot.currency == "BRL"' <<<"$response" >/dev/null
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "PASS: vaga reservada"

      - name: Confirmar contador caiu para 1
        shell: bash
        env:
          MARKET: ci-worker-lot-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/lots-after.json -w '%{http_code}' "${PREVIEW_URL}/api/lots?market=${MARKET}" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .current.remaining == 1 and .current.claimed == 1' /tmp/lots-after.json >/dev/null 2>&1; then
              echo "PASS: contador = 1"
              exit 0
            fi
            echo "Aguardando endpoint estabilizar (${attempt}/30, HTTP ${code})"
            sleep 2
          done
          cat /tmp/lots-after.json 2>/dev/null || true
          exit 1

      - name: Aguardar espelho reconhecer contato existente
        if: steps.register.outputs.submission_id != ''
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.register.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for attempt in $(seq 1 20); do
            body=$(jq -nc --arg id "$SUBMISSION_ID" '{sql:"SELECT sheet_sync_status FROM leads WHERE submission_id = ? LIMIT 1",params:[$id]}')
            response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
            status=$(jq -r '.result[0].results[0].sheet_sync_status // empty' <<<"$response")
            if [ "$status" = "synced" ]; then
              echo "PASS: Sheets duplicate reconhecido"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Limpar teste
        if: always()
        shell: bash
        env:
          MARKET: ci-worker-lot-${{ github.run_id }}-${{ github.run_attempt }}
          SUBMISSION_ID: ${{ steps.register.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          if [ -n "${SUBMISSION_ID:-}" ]; then
            for sql in "DELETE FROM system_events WHERE submission_id = ?" "DELETE FROM lead_lot_allocations WHERE submission_id = ?" "DELETE FROM leads WHERE submission_id = ?"; do
              body=$(jq -nc --arg sql "$sql" --arg id "$SUBMISSION_ID" '{sql:$sql,params:[$id]}')
              curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body" >/dev/null
            done
          fi
          body=$(jq -nc --arg market "$MARKET" '{sql:"DELETE FROM registration_lots WHERE market_key = ?",params:[$market]}')
          curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body" >/dev/null
          echo "PASS: fixture removida"

      - name: Registrar resultado
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body='### Worker lot smoke\n\n✅ `/api/lots`: 2 vagas antes.\n✅ `/api/register`: reservou 1 vaga.\n✅ Retorno: lote + preço/moeda + 1 vaga restante.\n✅ `/api/lots`: 1 vaga depois.\n✅ Fixture removida.\n\n**PASS — lotes funcionando no preview; nenhum lote comercial ativo.**'
