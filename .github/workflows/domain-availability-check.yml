# trigger: registrar read-only recheck
name: Domain availability check

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/domain-availability-check.yml"
  push:
    branches: ["infra/cloudflare-foundation"]
    paths:
      - ".github/workflows/domain-availability-check.yml"
  workflow_dispatch:
    inputs:
      domains:
        description: 'Lista separada por vírgula; vazio usa shortlist padrão'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      PR_NUMBER: '14'
    steps:
      - name: Consultar disponibilidade e preço sem registrar
        id: check
        shell: bash
        env:
          INPUT_DOMAINS: ${{ inputs.domains }}
        run: |
          set -euo pipefail
          raw="${INPUT_DOMAINS:-}"
          if [ -z "$raw" ]; then
            raw='gptrademanager.com,gptradingpro.com,gptraderpro.com,gptradinghub.com,gptradingmanager.com'
          fi
          json=$(jq -nc --arg raw "$raw" '{domains:($raw|split(",")|map(gsub("^\\s+|\\s+$";""))|map(select(length>0)))}')
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/registrar/domain-check" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$json")
          code=$(tail -n1 <<<"$response")
          body=$(sed '$d' <<<"$response")
          printf '%s' "$body" > /tmp/domain-check.json
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != '200' ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo '## Disponibilidade de domínios' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Domínio | Registrável | Registro | Renovação | Moeda | Motivo |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|---:|---|---|' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.result.domains[] | "| \(.name) | \(.registrable) | \(.pricing.registration_cost // "-") | \(.pricing.renewal_cost // "-") | \(.pricing.currency // "-") | \(.reason // "-") |"' <<<"$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Atualizar resultado no PR 14
        shell: bash
        env:
          HTTP_CODE: ${{ steps.check.outputs.http_code }}
          AVAILABLE: ${{ steps.check.outputs.available }}
        run: |
          set -euo pipefail
          marker='<!-- domain-availability-check -->'
          {
            echo "$marker"
            echo '### Domínios — checagem Cloudflare Registrar'
            echo
            if [ "$AVAILABLE" = true ]; then
              echo '| Domínio | Registrável | Registro | Renovação | Moeda | Motivo |'
              echo '|---|---:|---:|---:|---|---|'
              jq -r '.result.domains[] | "| `\(.name)` | \(.registrable) | \(.pricing.registration_cost // "-") | \(.pricing.renewal_cost // "-") | \(.pricing.currency // "-") | \(.reason // "-") |"' /tmp/domain-check.json
              echo
              echo '_Consulta de disponibilidade/preço somente. Nenhum domínio foi registrado e nenhuma cobrança foi feita._'
            else
              echo "A API de consulta do Registrar não está acessível com o token atual (HTTP ${HTTP_CODE})."
              echo
              echo '```json'
              jq -c '{success,errors,messages}' /tmp/domain-check.json 2>/dev/null || echo '{}'
              echo '```'
              echo
              echo '_Nenhuma compra ou alteração de domínio foi executada._'
            fi
          } > /tmp/comment.md

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- domain-availability-check -->")) | .id' | head -n1 || true)
          payload=$(jq -Rs '{body:.}' < /tmp/comment.md)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input - <<<"$payload" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - <<<"$payload" >/dev/null
          fi

      - name: Gate da consulta
        if: steps.check.outputs.available != 'true'
        shell: bash
        run: |
          echo 'NO-GO apenas para consulta automatizada do Registrar: token sem permissão/feature disponível.'
          exit 2
