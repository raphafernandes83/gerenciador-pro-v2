name: Sheets mirror authorization smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/mirror-auth-smoke.yml"
      - "src/worker-entry.js"
  push:
    branches: ["infra/cloudflare-foundation"]
    paths:
      - ".github/workflows/mirror-auth-smoke.yml"
      - "src/worker-entry.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
      PREVIEW_URL: https://infra-cloudflare-foundation-gerenciador-pro-v2.animaisfofinhos1983.workers.dev
    steps:
      - name: Preparar lead QA no D1
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          id="qa-mirror-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          original=$(jq -nc '{cidade_estado:"Rio de Janeiro — RJ",contato_preferido:"WhatsApp",experiencia_trading:"Menos de 6 meses",principal_objetivo:"Organizar",tamanho_publico:"",experiencia_afiliado:"",enviado_em_local:"2026-08-23T06:00:00.000Z"}')
          sql="INSERT INTO leads (submission_id,tipo_interesse,nome,whatsapp,whatsapp_norm,email,email_norm,pais,consentimento,canal_divulgacao,link_canal,observacao,origem,utm_source,utm_medium,utm_campaign,pagina_url,user_agent,enviado_em_local,payload_json,sheet_sync_status) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?, 'pending')"
          params=$(jq -nc --arg id "$id" --arg payload "$original" '[$id,"comprar","QA MIRROR AUTH","+5521900000099","5521900000099","qa.mirror.auth@example.com","qa.mirror.auth@example.com","Brazil",1,null,null,"QA auth","ci-mirror-auth","qa","github","mirror-auth","https://preview.invalid/","GitHub Actions","2026-08-23T06:00:00.000Z",$payload]')
          body=$(jq -nc --arg sql "$sql" --argjson params "$params" '{sql:$sql,params:$params}')
          response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
          test "$(jq -r '.success // false' <<<"$response")" = "true"

      - name: Aguardar endpoint de autorizacao
        shell: bash
        env:
          QA_ID: ${{ steps.qa.outputs.id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            payload=$(jq -nc --arg id "$QA_ID" '{submission_id:$id,tipo_interesse:"comprar",nome:"QA MIRROR AUTH",whatsapp:"+5521900000099",email:"qa.mirror.auth@example.com",pais:"Brazil",cidade_estado:"Rio de Janeiro — RJ",contato_preferido:"WhatsApp",experiencia_trading:"Menos de 6 meses",principal_objetivo:"Organizar",canal_divulgacao:"",tamanho_publico:"",link_canal:"",experiencia_afiliado:"",observacao:"QA auth",consentimento:"Sim",origem:"ci-mirror-auth",utm_source:"qa",utm_medium:"github",utm_campaign:"mirror-auth",pagina_url:"https://preview.invalid/",enviado_em_local:"2026-08-23T06:00:00.000Z",user_agent:"GitHub Actions"}')
            code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X POST "${PREVIEW_URL}/api/mirror/authorize" -H "Content-Type: application/json" --data "$payload" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/auth.json >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          cat /tmp/auth.json 2>/dev/null || true
          exit 1

      - name: Payload canonico deve autorizar
        shell: bash
        env:
          QA_ID: ${{ steps.qa.outputs.id }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg id "$QA_ID" '{submission_id:$id,tipo_interesse:"comprar",nome:"QA MIRROR AUTH",whatsapp:"+5521900000099",email:"qa.mirror.auth@example.com",pais:"Brazil",cidade_estado:"Rio de Janeiro — RJ",contato_preferido:"WhatsApp",experiencia_trading:"Menos de 6 meses",principal_objetivo:"Organizar",canal_divulgacao:"",tamanho_publico:"",link_canal:"",experiencia_afiliado:"",observacao:"QA auth",consentimento:"Sim",origem:"ci-mirror-auth",utm_source:"qa",utm_medium:"github",utm_campaign:"mirror-auth",pagina_url:"https://preview.invalid/",enviado_em_local:"2026-08-23T06:00:00.000Z",user_agent:"GitHub Actions"}')
          response=$(curl --fail-with-body -sS -X POST "${PREVIEW_URL}/api/mirror/authorize" -H "Content-Type: application/json" --data "$payload")
          jq -e '.ok == true' <<<"$response" >/dev/null

      - name: Payload adulterado deve bloquear
        shell: bash
        env:
          QA_ID: ${{ steps.qa.outputs.id }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg id "$QA_ID" '{submission_id:$id,tipo_interesse:"comprar",nome:"QA MIRROR AUTH",whatsapp:"+5521999999999",email:"qa.mirror.auth@example.com",pais:"Brazil",cidade_estado:"Rio de Janeiro — RJ",contato_preferido:"WhatsApp",experiencia_trading:"Menos de 6 meses",principal_objetivo:"Organizar",canal_divulgacao:"",tamanho_publico:"",link_canal:"",experiencia_afiliado:"",observacao:"QA auth",consentimento:"Sim",origem:"ci-mirror-auth",utm_source:"qa",utm_medium:"github",utm_campaign:"mirror-auth",pagina_url:"https://preview.invalid/",enviado_em_local:"2026-08-23T06:00:00.000Z",user_agent:"GitHub Actions"}')
          code=$(curl -sS -o /tmp/tampered.json -w '%{http_code}' -X POST "${PREVIEW_URL}/api/mirror/authorize" -H "Content-Type: application/json" --data "$payload")
          test "$code" = "403"
          jq -e '.ok == false and .error == "mirror_unauthorized"' /tmp/tampered.json >/dev/null

      - name: ID inexistente deve bloquear
        shell: bash
        run: |
          set -euo pipefail
          payload='{"submission_id":"qa-mirror-does-not-exist"}'
          code=$(curl -sS -o /tmp/missing.json -w '%{http_code}' -X POST "${PREVIEW_URL}/api/mirror/authorize" -H "Content-Type: application/json" --data "$payload")
          test "$code" = "403"

      - name: Lead synced nao pode autorizar nova escrita
        shell: bash
        env:
          QA_ID: ${{ steps.qa.outputs.id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          body=$(jq -nc --arg id "$QA_ID" '{sql:"UPDATE leads SET sheet_sync_status=\"synced\" WHERE submission_id=?",params:[$id]}')
          curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body" >/dev/null
          payload=$(jq -nc --arg id "$QA_ID" '{submission_id:$id,tipo_interesse:"comprar",nome:"QA MIRROR AUTH",whatsapp:"+5521900000099",email:"qa.mirror.auth@example.com",pais:"Brazil",cidade_estado:"Rio de Janeiro — RJ",contato_preferido:"WhatsApp",experiencia_trading:"Menos de 6 meses",principal_objetivo:"Organizar",canal_divulgacao:"",tamanho_publico:"",link_canal:"",experiencia_afiliado:"",observacao:"QA auth",consentimento:"Sim",origem:"ci-mirror-auth",utm_source:"qa",utm_medium:"github",utm_campaign:"mirror-auth",pagina_url:"https://preview.invalid/",enviado_em_local:"2026-08-23T06:00:00.000Z",user_agent:"GitHub Actions"}')
          code=$(curl -sS -o /tmp/synced.json -w '%{http_code}' -X POST "${PREVIEW_URL}/api/mirror/authorize" -H "Content-Type: application/json" --data "$payload")
          test "$code" = "403"
          echo "PASS: autorizacao do espelho vinculada ao D1"

      - name: Limpar QA
        if: always()
        shell: bash
        env:
          QA_ID: ${{ steps.qa.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "${QA_ID:-}" ]; then exit 0; fi
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for sql in "DELETE FROM system_events WHERE submission_id=?" "DELETE FROM lead_lot_allocations WHERE submission_id=?" "DELETE FROM leads WHERE submission_id=?"; do
            body=$(jq -nc --arg sql "$sql" --arg id "$QA_ID" '{sql:$sql,params:[$id]}')
            curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body" >/dev/null
          done
