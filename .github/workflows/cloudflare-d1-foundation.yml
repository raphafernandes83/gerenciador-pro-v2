name: Cloudflare D1 foundation

on:
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/cloudflare-d1-foundation.yml"
      - "migrations/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-d1-foundation.yml"
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      D1_NAME: gerenciador-pro-leads
    steps:
      - uses: actions/checkout@v4

      - name: Criar ou localizar D1 e aplicar schema
        id: d1
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Token Cloudflare ausente"; exit 1; }

          list_db() {
            npx --yes wrangler@latest d1 list --json
          }

          databases=$(list_db)
          database_id=$(jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' <<<"$databases" | head -n1)

          if [ -z "$database_id" ] || [ "$database_id" = "null" ]; then
            echo "D1 nao existe; criando ${D1_NAME} em Eastern North America..."
            npx --yes wrangler@latest d1 create "$D1_NAME" --location enam
            databases=$(list_db)
            database_id=$(jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' <<<"$databases" | head -n1)
          else
            echo "D1 ${D1_NAME} ja existe; reutilizando."
          fi

          test -n "$database_id" && test "$database_id" != "null" || { echo "Nao foi possivel obter database_id"; exit 1; }

          npx --yes wrangler@latest d1 execute "$D1_NAME" --remote --file=./migrations/0001_leads.sql

          validation=$(npx --yes wrangler@latest d1 execute "$D1_NAME" --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('leads','system_events') ORDER BY name;" --json)
          leads_ok=$(jq -r '[.[].results[]?.name] | index("leads") != null' <<<"$validation")
          events_ok=$(jq -r '[.[].results[]?.name] | index("system_events") != null' <<<"$validation")
          test "$leads_ok" = "true" && test "$events_ok" = "true" || { echo "Schema D1 nao validou"; exit 1; }

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "PASS: D1 ${D1_NAME} pronto"
          echo "PASS: database_id=${database_id}"

      - name: Registrar resultado no PR
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          body="### Cloudflare D1 foundation

✅ Banco \`${D1_NAME}\` criado/localizado.
✅ Schema \`leads\` e \`system_events\` aplicado e validado.
✅ Database ID: \`${DATABASE_ID}\`.

Próximo passo: vincular este D1 ao Worker do preview e testar \`/api/register\`."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Publicar status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="D1 foundation ready"
          else
            state=failure
            description="D1 foundation failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="cloudflare/d1-foundation" -f description="$description"
