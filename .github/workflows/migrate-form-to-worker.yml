name: Migrate form to Worker API

on:
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/migrate-form-to-worker.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-foundation
          fetch-depth: 0

      - name: Trocar transporte do formulario para Worker API
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("script.js")
          text = path.read_text(encoding="utf-8")

          old_config_check = '''  function isConfigured() {
            const endpoint = window.GP_FORM_CONFIG?.endpoint || "";
            return endpoint.startsWith("https://script.google.com/") && endpoint.endsWith("/exec");
          }'''

          new_config_check = '''  function isConfigured() {
            const endpoint = window.GP_FORM_CONFIG?.endpoint || "";
            return endpoint === "/api/register" || /^https?:\\/\\/[^\\s]+\\/api\\/register(?:[?#].*)?$/.test(endpoint);
          }'''

          if old_config_check not in text:
            raise SystemExit("Bloco isConfigured original nao encontrado; abortando sem alterar arquivo.")
          text = text.replace(old_config_check, new_config_check, 1)

          pattern = re.compile(
            r'  /\\*\\*\\n   \\* Envia o formulário para o Apps Script.*?\\n  function submitThroughConfirmedIframe\\(\\) \\{.*?\\n  \\}\\n\\n  // --- Listeners',
            re.S,
          )

          new_transport = '''  /**
           * Envia o cadastro para o Worker de mesma origem.
           * Sucesso só é exibido depois que o Worker confirma a gravação no D1.
           */
          async function submitToWorker() {
            const endpoint = window.GP_FORM_CONFIG?.endpoint || "/api/register";
            const submissionId = createSubmissionId();
            const timeoutMs = Math.max(5000, Number(window.GP_FORM_CONFIG?.requestTimeoutMs || 15000));
            const data = Object.fromEntries(new FormData(form).entries());

            data.enviado_em_local = new Date().toISOString();
            data.submission_id = submissionId;

            const controller = new AbortController();
            const timeoutTimer = window.setTimeout(() => controller.abort(), timeoutMs);

            try {
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json"
                },
                body: JSON.stringify(data),
                signal: controller.signal
              });

              let result;
              try {
                result = await response.json();
              } catch (error) {
                throw new Error(T("msg.respostaInvalida", "The server returned an invalid response. Please try again."));
              }

              if (!response.ok || !result?.ok) {
                throw new Error(result?.error || T("msg.naoGravado", "Your registration was not saved."));
              }

              if (!result.submissionId && !result.ignored) {
                throw new Error(T("msg.semConfirmacao", "The server did not confirm the save. Please try again."));
              }

              return result;
            } catch (error) {
              if (error?.name === "AbortError") {
                throw new Error(T("msg.semConfirmacao", "The server did not confirm the save in time. Please try again."));
              }
              throw error;
            } finally {
              window.clearTimeout(timeoutTimer);
            }
          }

          // --- Listeners'''

          text, count = pattern.subn(new_transport, text, count=1)
          if count != 1:
            raise SystemExit(f"Bloco de transporte original nao encontrado de forma unica: {count}")

          old_call = "const result = await submitThroughConfirmedIframe();"
          new_call = "const result = await submitToWorker();"
          if text.count(old_call) != 1:
            raise SystemExit("Chamada do transporte original nao encontrada de forma unica.")
          text = text.replace(old_call, new_call, 1)

          if "submitThroughConfirmedIframe" in text:
            raise SystemExit("Referencia antiga ainda presente; abortando.")
          if "submitToWorker" not in text:
            raise SystemExit("Novo transporte nao foi inserido; abortando.")

          path.write_text(text, encoding="utf-8")
          Path("config.js").write_text(
            'window.GP_FORM_CONFIG={endpoint:"/api/register",requestTimeoutMs:15000};\\n',
            encoding="utf-8",
          )

      - name: Validar JavaScript alterado
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          node --check config.js
          grep -F 'endpoint:"/api/register"' config.js
          grep -F 'submitToWorker' script.js
          ! grep -F 'submitThroughConfirmedIframe' script.js

      - name: Commitar somente a migracao validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js config.js
          git diff --cached --quiet && { echo "Nada para alterar"; exit 0; }
          git commit -m "api: route capture form through Worker and D1"
          git push origin HEAD:infra/cloudflare-foundation
