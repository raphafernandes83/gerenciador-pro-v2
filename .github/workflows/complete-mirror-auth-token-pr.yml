name: Complete mirror auth token PR

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/complete-mirror-auth-token.py"
      - "src/worker.js"
      - "src/worker-entry.js"
      - "scripts/reconcile-sheets.mjs"
      - "scripts/pull-sheet-retry-queue.mjs"
      - "scripts/apps-script/Code.secure.gs"
      - ".github/workflows/mirror-auth-smoke.yml"
      - ".github/workflows/apps-script-secure-check.yml"
      - ".github/workflows/production-readiness.yml"
      - ".github/workflows/complete-mirror-auth-token-pr.yml"

permissions:
  contents: write

concurrency:
  group: complete-mirror-auth-token-pr
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Aplicar migrador idempotente
        run: python scripts/complete-mirror-auth-token.py

      - name: Validar sintaxe
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/worker-entry.js
          node --check scripts/reconcile-sheets.mjs
          node --check scripts/pull-sheet-retry-queue.mjs
          cp scripts/apps-script/Code.secure.gs /tmp/code-secure.js
          node --check /tmp/code-secure.js

      - name: Commitar somente se necessario
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'PASS: mirror auth token já está completo'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker.js src/worker-entry.js scripts/reconcile-sheets.mjs scripts/pull-sheet-retry-queue.mjs scripts/apps-script/Code.secure.gs .github/workflows/mirror-auth-smoke.yml .github/workflows/apps-script-secure-check.yml .github/workflows/production-readiness.yml
          git commit -m 'security: ligar mirror auth token ponta a ponta'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
