name: Apps Script secure source check

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/apps-script-secure-check.yml"
      - "scripts/apps-script/Code.secure.gs"
      - "scripts/apps-script/appsscript.json"
  push:
    branches: ["infra/cloudflare-foundation"]
    paths:
      - ".github/workflows/apps-script-secure-check.yml"
      - "scripts/apps-script/Code.secure.gs"
      - "scripts/apps-script/appsscript.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe V8 e manifest
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/apps-script/Code.secure.gs /tmp/apps-script-secure.js
          node --check /tmp/apps-script-secure.js
          jq -e '.runtimeVersion == "V8"' scripts/apps-script/appsscript.json >/dev/null
          jq -e '.oauthScopes | index("https://www.googleapis.com/auth/spreadsheets") != null' scripts/apps-script/appsscript.json >/dev/null
          jq -e '.oauthScopes | index("https://www.googleapis.com/auth/script.external_request") != null' scripts/apps-script/appsscript.json >/dev/null
          jq -e '.oauthScopes | index("https://www.googleapis.com/auth/script.scriptapp") != null' scripts/apps-script/appsscript.json >/dev/null

      - name: Validar gates de seguranca
        shell: bash
        run: |
          set -euo pipefail
          file=scripts/apps-script/Code.secure.gs
          grep -F 'MIRROR_AUTH_PROPERTY_KEY: "GP_MIRROR_AUTH_URL"' "$file" >/dev/null
          grep -F 'VERSION: "2026-08-23.3"' "$file" >/dev/null
          grep -F '_mirror_auth_token' "$file" >/dev/null
          grep -F 'getMirrorAuthUrl_' "$file" >/dev/null
          grep -F 'authorizeMirrorPayload_' "$file" >/dev/null
          grep -F 'findSubmissionId_' "$file" >/dev/null
          grep -F 'OFFICIAL_SPREADSHEET_UNAVAILABLE' "$file" >/dev/null
          grep -F 'status: ready ? "ready" : "not_ready"' "$file" >/dev/null
          ! grep -F 'animaisfofinhos1983.workers.dev/api/mirror/authorize' "$file" >/dev/null
          ! grep -F 'postMessage(' "$file" >/dev/null
          ! grep -F 'HtmlService' "$file" >/dev/null
          ! grep -F 'spreadsheetUrl:' "$file" >/dev/null
          ! grep -F 'spreadsheetId:' "$file" >/dev/null
          echo "PASS: Apps Script v3 exige capability token, URL por ambiente, OAuth explícito e não expõe dados internos"
