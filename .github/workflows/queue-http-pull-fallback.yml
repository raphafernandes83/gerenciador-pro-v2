name: Queue HTTP pull fallback

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/queue-http-pull-fallback.yml"
      - "scripts/pull-sheet-retry-queue.mjs"
  push:
    branches: ["infra/cloudflare-foundation"]
    paths:
      - ".github/workflows/queue-http-pull-fallback.yml"
      - "scripts/pull-sheet-retry-queue.mjs"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gp-queue-http-pull
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
  D1_DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
  RETRY_QUEUE_ID: 7f6abeea1385470490a85aaf4d4ca1ba
  RETRY_QUEUE_NAME: gerenciador-pro-sheet-retry
  DLQ_QUEUE_NAME: gerenciador-pro-sheet-retry-dlq
  SHEETS_MIRROR_URL: https://script.google.com/macros/s/AKfycbyiGH-5FRXZteXMgog2bhaSEA1_UMOe78irya7DinWGfkmqDft6ELDJrcj12eHjMU2ZFQ/exec

jobs:
  configure:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Garantir HTTP pull consumer
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${RETRY_QUEUE_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          current=$(curl --fail-with-body -sS "${base}/consumers" -H "$auth")
          test "$(jq -r '.success // false' <<<"$current")" = "true"
          count=$(jq -r '.result | length' <<<"$current")

          if [ "$count" -eq 0 ]; then
            payload=$(jq -nc --arg dlq "$DLQ_QUEUE_NAME" '{type:"http_pull",dead_letter_queue:$dlq,settings:{batch_size:50,max_retries:5,retry_delay:60,visibility_timeout_ms:120000}}')
            created=$(curl --fail-with-body -sS -X POST "${base}/consumers" \
              -H "$auth" -H "Content-Type: application/json" --data "$payload")
            test "$(jq -r '.success // false' <<<"$created")" = "true"
            test "$(jq -r '.result.type // empty' <<<"$created")" = "http_pull"
            echo "PASS: HTTP pull consumer criado"
          else
            type=$(jq -r '.result[0].type // empty' <<<"$current")
            test "$count" -eq 1
            test "$type" = "http_pull" || { echo "FAIL: Queue ja possui consumer do tipo ${type}"; exit 1; }
            echo "PASS: HTTP pull consumer ja configurado"
          fi

          verify=$(curl --fail-with-body -sS "${base}/consumers" -H "$auth")
          test "$(jq -r '.success // false' <<<"$verify")" = "true"
          test "$(jq -r '.result | length' <<<"$verify")" -eq 1
          test "$(jq -r '.result[0].type' <<<"$verify")" = "http_pull"
          echo "PASS: consumer verificado"

  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enfileirar mensagem QA sem lead
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          qa_id="qa-http-pull-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "qa_id=$qa_id" >> "$GITHUB_OUTPUT"
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${RETRY_QUEUE_ID}/messages"
          payload=$(jq -nc --arg id "$qa_id" '{body:{type:"sheet_mirror_retry",submissionId:$id,reason:"qa_missing_lead"}}')
          response=$(curl --fail-with-body -sS -X POST "$url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$payload")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          echo "PASS: mensagem QA enfileirada"

      - name: Consumir via HTTP pull
        run: node scripts/pull-sheet-retry-queue.mjs

      - name: Confirmar ack sem criar lead
        shell: bash
        env:
          QA_ID: ${{ steps.qa.outputs.qa_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          sql="SELECT (SELECT COUNT(*) FROM leads WHERE submission_id=?) AS leads, (SELECT COUNT(*) FROM system_events WHERE submission_id=? AND event_type='sheet_pull_missing_lead') AS events"
          body=$(jq -nc --arg sql "$sql" --arg id "$QA_ID" '{sql:$sql,params:[$id,$id]}')
          response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          test "$(jq -r '.result[0].results[0].leads // -1' <<<"$response")" = "0"
          test "$(jq -r '.result[0].results[0].events // 0' <<<"$response")" -ge 1

          cleanup=$(jq -nc --arg id "$QA_ID" '{sql:"DELETE FROM system_events WHERE submission_id=?",params:[$id]}')
          curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$cleanup" >/dev/null
          echo "PASS: pull + ack confirmado sem lead/Sheets"

  consume:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consumir retries pendentes
        run: node scripts/pull-sheet-retry-queue.mjs
