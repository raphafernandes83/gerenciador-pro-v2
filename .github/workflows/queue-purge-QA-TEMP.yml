name: TEMP purge orphaned QA Queue

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/queue-purge-QA-TEMP.yml"
  push:
    branches: ["infra/cloudflare-foundation"]
    paths:
      - ".github/workflows/queue-purge-QA-TEMP.yml"

permissions:
  contents: read

jobs:
  purge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
      QUEUE_ID: 7f6abeea1385470490a85aaf4d4ca1ba
    steps:
      - name: Garantir que D1 nao tem leads antes do purge
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          body='{"sql":"SELECT COUNT(*) AS total FROM leads","params":[]}'
          response=$(curl --fail-with-body -sS -X POST "$api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "$body")
          total=$(jq -r '.result[0].results[0].total // -1' <<<"$response")
          test "$total" = "0"
          echo "PASS: D1 sem leads; purge de residuos QA autorizado"

      - name: Purgar Queue de retry
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/queues/${QUEUE_ID}/purge"
          response=$(curl --fail-with-body -sS -X POST "$url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"delete_messages_permanently":true}')
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          echo "PASS: Queue QA purgada"
