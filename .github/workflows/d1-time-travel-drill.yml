name: D1 Time Travel recovery drill

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/d1-time-travel-drill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
    steps:
      - name: Criar D1 descartavel
        id: db
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          name="gp-dr-qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body=$(jq -nc --arg name "$name" '{name:$name}')
          response=$(curl --fail-with-body -sS -X POST "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$body")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          db_id=$(jq -r '.result.uuid // empty' <<<"$response")
          test -n "$db_id"
          echo "db_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "PASS: banco descartavel criado"

      - name: Gravar estado inicial
        shell: bash
        env:
          DB_ID: ${{ steps.db.outputs.db_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for sql in \
            "CREATE TABLE recovery_test (id INTEGER PRIMARY KEY, value TEXT NOT NULL)" \
            "INSERT INTO recovery_test (id,value) VALUES (1,'before')"; do
            body=$(jq -nc --arg sql "$sql" '{sql:$sql,params:[]}')
            response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
            test "$(jq -r '.success // false' <<<"$response")" = "true"
          done
          echo "PASS: estado inicial gravado"

      - name: Capturar bookmark
        id: bookmark
        shell: bash
        env:
          DB_ID: ${{ steps.db.outputs.db_id }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/time_travel/bookmark"
          for attempt in $(seq 1 20); do
            response=$(curl --fail-with-body -sS "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            bookmark=$(jq -r '.result.bookmark // empty' <<<"$response")
            if [ "$(jq -r '.success // false' <<<"$response")" = "true" ] && [ -n "$bookmark" ]; then
              echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
              echo "PASS: bookmark capturado"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Alterar estado depois do bookmark
        shell: bash
        env:
          DB_ID: ${{ steps.db.outputs.db_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          body='{"sql":"UPDATE recovery_test SET value=\"after\" WHERE id=1","params":[]}'
          response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body")
          test "$(jq -r '.success // false' <<<"$response")" = "true"

          check='{"sql":"SELECT value FROM recovery_test WHERE id=1","params":[]}'
          response=$(curl --fail-with-body -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$check")
          test "$(jq -r '.result[0].results[0].value // empty' <<<"$response")" = "after"
          echo "PASS: estado posterior confirmado"

      - name: Restaurar Time Travel
        shell: bash
        env:
          DB_ID: ${{ steps.db.outputs.db_id }}
          BOOKMARK: ${{ steps.bookmark.outputs.bookmark }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/time_travel/restore"
          response=$(curl --fail-with-body -sS -X POST \
            --get --data-urlencode "bookmark=${BOOKMARK}" "$url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          test -n "$(jq -r '.result.previous_bookmark // empty' <<<"$response")"
          echo "PASS: restore aceito"

      - name: Provar dado restaurado
        shell: bash
        env:
          DB_ID: ${{ steps.db.outputs.db_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          body='{"sql":"SELECT value FROM recovery_test WHERE id=1","params":[]}'
          for attempt in $(seq 1 30); do
            response=$(curl -sS -X POST "$api" -H "$auth" -H "Content-Type: application/json" --data "$body" || true)
            value=$(jq -r '.result[0].results[0].value // empty' <<<"$response" 2>/dev/null || true)
            if [ "$value" = "before" ]; then
              echo "PASS: Time Travel restaurou o estado anterior"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Apagar D1 descartavel
        if: always() && steps.db.outputs.db_id != ''
        shell: bash
        env:
          DB_ID: ${{ steps.db.outputs.db_id }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}"
          response=$(curl --fail-with-body -sS -X DELETE "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          echo "PASS: banco descartavel removido"
