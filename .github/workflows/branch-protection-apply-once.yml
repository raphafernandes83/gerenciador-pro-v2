name: Branch protection apply once

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/branch-protection-apply-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 14
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exigir Pull Request em main sem alterar outras proteções
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/branches/main/protection/required_pull_request_reviews"

          if gh api "$endpoint" >/dev/null 2>&1; then
            echo 'PASS: main já exige Pull Request'
            exit 0
          fi

          gh api --method PATCH "$endpoint" \
            -F dismiss_stale_reviews=false \
            -F require_code_owner_reviews=false \
            -F required_approving_review_count=0 \
            -F require_last_push_approval=false >/tmp/main-pr-protection.json

          gh api "$endpoint" >/dev/null
          protection=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection")
          force=$(jq -r '.allow_force_pushes.enabled // false' <<<"$protection")
          deletion=$(jq -r '.allow_deletions.enabled // false' <<<"$protection")
          test "$force" = false
          test "$deletion" = false
          echo 'PASS: main agora exige Pull Request; force-push e exclusão continuam OFF'
