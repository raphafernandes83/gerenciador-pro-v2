name: Cloudflare audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-audit.yml"
      - "migrations/**"
      - "src/**"
      - "wrangler.jsonc"
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/cloudflare-audit.yml"
      - "migrations/**"
      - "src/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      BOOTSTRAP_BUILD_UUID: 69fbbd6b-de5d-4e22-b0e5-168641be3394
    steps:
      - name: Auditar token e Workers Builds
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Token ausente"; exit 1; }
          verify=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$verify")" = "true"
          build=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/builds/${BOOTSTRAP_BUILD_UUID}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          tag=$(jq -r '.result.trigger.external_script_id // empty' <<<"$build")
          test -n "$tag"
          triggers=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${tag}/triggers" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$triggers")" = "true"
          prod_ok=$(jq -r '[.result[] | select(.deploy_command == "npx wrangler deploy") | .branch_includes] | any(. == ["production"])' <<<"$triggers")
          preview_ok=$(jq -r '[.result[] | select(.deploy_command == "npx wrangler versions upload") | .branch_excludes] | any(. == ["production"])' <<<"$triggers")
          test "$prod_ok" = "true" && test "$preview_ok" = "true"
          echo "PASS: Cloudflare token + Builds + branch control"

  d1:
    needs: audit
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      D1_NAME: gerenciador-pro-leads
    steps:
      - uses: actions/checkout@v4

      - name: Localizar D1 pela API
        id: db
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          response=$(curl --fail-with-body -sS "${api}/d1/database?name=${D1_NAME}&per_page=100" -H "$auth")
          test "$(jq -r '.success // false' <<<"$response")" = "true"
          database_id=$(jq -r --arg name "$D1_NAME" '.result[]? | select(.name == $name) | .uuid' <<<"$response" | head -n1)
          test -n "$database_id" && test "$database_id" != "null" || { echo "D1 ${D1_NAME} nao encontrado"; exit 1; }
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "PASS: D1 localizado ${database_id}"

      - name: Preparar config temporaria do D1
        shell: bash
        env:
          DATABASE_ID: ${{ steps.db.outputs.database_id }}
        run: |
          jq -n --arg id "$DATABASE_ID" --arg name "$D1_NAME" '{
            name: "gp-d1-migrate",
            compatibility_date: "2026-08-23",
            d1_databases: [{
              binding: "DB",
              database_name: $name,
              database_id: $id
            }]
          }' > /tmp/wrangler-d1.jsonc

      - name: Aplicar schema no D1 remoto
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute DB --remote --config /tmp/wrangler-d1.jsonc --file=./migrations/0001_leads.sql

      - name: Validar schema
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx --yes wrangler@latest d1 execute DB --remote --config /tmp/wrangler-d1.jsonc --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('leads','system_events') ORDER BY name;" --json)
          leads_ok=$(jq -r '[.[].results[]?.name] | index("leads") != null' <<<"$result")
          events_ok=$(jq -r '[.[].results[]?.name] | index("system_events") != null' <<<"$result")
          test "$leads_ok" = "true" && test "$events_ok" = "true"
          echo "PASS: leads + system_events"

      - name: Registrar D1 no PR
        if: success() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_ID: ${{ steps.db.outputs.database_id }}
        run: |
          body=$(printf '### D1 criado e validado\n\n✅ `%s` pronto.\n✅ Tabelas `leads` e `system_events` prontas.\n✅ Database ID: `%s`.\n\nPróximo: testar `/api/register` no preview.' "$D1_NAME" "$DATABASE_ID")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

  smoke:
    if: github.event_name == 'pull_request'
    needs: d1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
      PREVIEW_URL: https://infra-cloudflare-foundation-gerenciador-pro-v2.animaisfofinhos1983.workers.dev
    steps:
      - name: Aguardar preview com Worker e D1
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${PREVIEW_URL}/api/health" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .database == "reachable"' /tmp/health.json >/dev/null 2>&1; then
              echo "PASS: /api/health com D1 reachable"
              exit 0
            fi
            echo "Preview ainda nao pronto (${attempt}/36, HTTP ${code})"
            sleep 5
          done
          echo "Preview nao ficou pronto a tempo"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Enviar cadastro sintetico
        id: register
        shell: bash
        run: |
          set -euo pipefail
          submission_id="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          phone="+5500${GITHUB_RUN_ID}"
          payload=$(jq -n \
            --arg submission_id "$submission_id" \
            --arg whatsapp "$phone" \
            '{
              submission_id: $submission_id,
              tipo_interesse: "comprar",
              nome: "Cloudflare Smoke Test",
              whatsapp: $whatsapp,
              pais: "Brasil",
              consentimento: true,
              origem: "ci-smoke-test"
            }')
          response=$(curl --fail-with-body -sS \
            -X POST "${PREVIEW_URL}/api/register" \
            -H "Content-Type: application/json" \
            --data "$payload")
          jq -e --arg id "$submission_id" '.ok == true and .duplicate == false and .submissionId == $id' <<<"$response" >/dev/null
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "PASS: /api/register confirmou gravacao"

      - name: Confirmar registro diretamente no D1
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.register.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          payload=$(jq -n --arg id "$SUBMISSION_ID" '{sql:"SELECT submission_id FROM leads WHERE submission_id = ? LIMIT 1", params:[$id]}')
          response=$(curl --fail-with-body -sS \
            -X POST "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          jq -e --arg id "$SUBMISSION_ID" '.success == true and (.result[0].results | length) == 1 and .result[0].results[0].submission_id == $id' <<<"$response" >/dev/null
          echo "PASS: cadastro confirmado diretamente no D1"

      - name: Apagar cadastro sintetico
        if: always() && steps.register.outputs.submission_id != ''
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.register.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          payload=$(jq -n --arg id "$SUBMISSION_ID" '{sql:"DELETE FROM leads WHERE submission_id = ?", params:[$id]}')
          response=$(curl --fail-with-body -sS \
            -X POST "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          jq -e '.success == true' <<<"$response" >/dev/null
          echo "PASS: cadastro sintetico removido"

      - name: Registrar smoke test no PR
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '### Worker + D1 smoke test\n\n✅ `/api/health`: Worker e D1 acessíveis.\n✅ `/api/register`: cadastro sintético confirmado.\n✅ D1: registro confirmado por consulta direta.\n✅ Limpeza: cadastro sintético removido.\n\n**Resultado: PASS — Worker + D1 funcionando no preview.**')
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
