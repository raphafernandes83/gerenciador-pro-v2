name: Cloudflare audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-audit.yml"
      - "migrations/**"
      - "src/**"
      - "wrangler.jsonc"
      - "script.js"
      - "config.js"
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/cloudflare-audit.yml"
      - "migrations/**"
      - "src/**"
      - "wrangler.jsonc"
      - "script.js"
      - "config.js"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      BOOTSTRAP_BUILD_UUID: 69fbbd6b-de5d-4e22-b0e5-168641be3394
    steps:
      - name: Auditar Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          verify=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$verify")" = "true"

          build=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/builds/${BOOTSTRAP_BUILD_UUID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          tag=$(jq -r '.result.trigger.external_script_id // empty' <<<"$build")
          test -n "$tag"

          triggers=$(curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${tag}/triggers" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          prod_ok=$(jq -r '[.result[] | select(.deploy_command == "npx wrangler deploy") | .branch_includes] | any(. == ["production"])' <<<"$triggers")
          preview_ok=$(jq -r '[.result[] | select(.deploy_command == "npx wrangler versions upload") | .branch_excludes] | any(. == ["production"])' <<<"$triggers")
          test "$prod_ok" = "true" && test "$preview_ok" = "true"
          echo "PASS: Cloudflare + branch control"

  migrate_form:
    if: github.event_name == 'pull_request'
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-foundation
          fetch-depth: 0

      - name: Migrar formulario para Worker
        shell: python
        run: |
          from pathlib import Path

          script = Path("script.js")
          text = script.read_text(encoding="utf-8")

          if "function submitToWorker()" not in text:
              config_start = text.find("  function isConfigured() {")
              config_end = text.find("\n  }\n", config_start)
              if config_start < 0 or config_end < 0:
                  raise SystemExit("isConfigured nao encontrado")
              config_end += len("\n  }\n")

              config_block = "\n".join([
                  "  function isConfigured() {",
                  '    const endpoint = window.GP_FORM_CONFIG?.endpoint || "";',
                  '    return endpoint === "/api/register" || endpoint.endsWith("/api/register");',
                  "  }",
                  "",
              ])
              text = text[:config_start] + config_block + text[config_end:]

              start = text.find("  /**\n   * Envia o formulário para o Apps Script")
              end = text.find("\n  // --- Listeners", start)
              if start < 0 or end < 0:
                  raise SystemExit("transporte Apps Script nao encontrado")

              transport = "\n".join([
                  "  /**",
                  "   * Envia o cadastro para o Worker de mesma origem.",
                  "   * Sucesso só é exibido depois que o Worker confirma a gravação no D1.",
                  "   */",
                  "  async function submitToWorker() {",
                  '    const endpoint = window.GP_FORM_CONFIG?.endpoint || "/api/register";',
                  "    const submissionId = createSubmissionId();",
                  "    const timeoutMs = Math.max(5000, Number(window.GP_FORM_CONFIG?.requestTimeoutMs || 15000));",
                  "    const data = Object.fromEntries(new FormData(form).entries());",
                  "    data.enviado_em_local = new Date().toISOString();",
                  "    data.submission_id = submissionId;",
                  "",
                  "    const controller = new AbortController();",
                  "    const timeoutTimer = window.setTimeout(() => controller.abort(), timeoutMs);",
                  "    try {",
                  "      const response = await fetch(endpoint, {",
                  '        method: "POST",',
                  '        headers: { "Content-Type": "application/json", "Accept": "application/json" },',
                  "        body: JSON.stringify(data),",
                  "        signal: controller.signal",
                  "      });",
                  "",
                  "      let result;",
                  "      try {",
                  "        result = await response.json();",
                  "      } catch (error) {",
                  '        throw new Error(T("msg.respostaInvalida", "The server returned an invalid response. Please try again."));',
                  "      }",
                  "",
                  "      if (!response.ok || !result?.ok) {",
                  '        throw new Error(result?.error || T("msg.naoGravado", "Your registration was not saved."));',
                  "      }",
                  "      if (!result.submissionId && !result.ignored) {",
                  '        throw new Error(T("msg.semConfirmacao", "The server did not confirm the save. Please try again."));',
                  "      }",
                  "      return result;",
                  "    } catch (error) {",
                  '      if (error?.name === "AbortError") {',
                  '        throw new Error(T("msg.semConfirmacao", "The server did not confirm the save in time. Please try again."));',
                  "      }",
                  "      throw error;",
                  "    } finally {",
                  "      window.clearTimeout(timeoutTimer);",
                  "    }",
                  "  }",
                  "",
              ])
              text = text[:start] + transport + text[end:]

              old_call = "const result = await submitThroughConfirmedIframe();"
              if text.count(old_call) != 1:
                  raise SystemExit("chamada antiga nao encontrada de forma unica")
              text = text.replace(old_call, "const result = await submitToWorker();", 1)

          if "submitThroughConfirmedIframe" in text:
              raise SystemExit("transporte antigo ainda presente")

          script.write_text(text, encoding="utf-8")
          Path("config.js").write_text(
              'window.GP_FORM_CONFIG={endpoint:"/api/register",requestTimeoutMs:15000};\n',
              encoding="utf-8",
          )

      - name: Validar migracao
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          node --check config.js
          grep -F 'endpoint:"/api/register"' config.js
          grep -F 'submitToWorker' script.js
          ! grep -F 'submitThroughConfirmedIframe' script.js

      - name: Publicar migracao na branch segura
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js config.js
          if git diff --cached --quiet; then
            echo "PASS: formulario ja migrado"
            exit 0
          fi
          git commit -m "api: route capture form through Worker and D1"
          git push origin HEAD:infra/cloudflare-foundation
          echo "PASS: formulario migrado"

  smoke:
    if: github.event_name == 'pull_request'
    needs: [audit, migrate_form]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      DATABASE_ID: 9e7b9736-b4d7-4aa1-9809-b2198bd0a0f4
      PREVIEW_URL: https://infra-cloudflare-foundation-gerenciador-pro-v2.animaisfofinhos1983.workers.dev
    steps:
      - name: Aguardar preview atualizado
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${PREVIEW_URL}/api/health" || true)
            config=$(curl -sS "${PREVIEW_URL}/config.js" || true)
            if [ "$code" = "200" ] \
              && jq -e '.ok == true and .database == "reachable"' /tmp/health.json >/dev/null 2>&1 \
              && grep -F 'endpoint:"/api/register"' <<<"$config" >/dev/null; then
              echo "PASS: preview atualizado"
              exit 0
            fi
            echo "Aguardando preview (${attempt}/48)"
            sleep 5
          done
          exit 1

      - name: Testar cadastro real no D1
        id: register
        shell: bash
        run: |
          set -euo pipefail
          submission_id="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          phone="+5500${GITHUB_RUN_ID}"
          payload=$(jq -n \
            --arg submission_id "$submission_id" \
            --arg whatsapp "$phone" \
            '{submission_id:$submission_id,tipo_interesse:"comprar",nome:"Cloudflare Smoke Test",whatsapp:$whatsapp,pais:"Brasil",consentimento:true,origem:"ci-smoke-test"}')
          response=$(curl --fail-with-body -sS -X POST "${PREVIEW_URL}/api/register" \
            -H "Content-Type: application/json" --data "$payload")
          jq -e --arg id "$submission_id" \
            '.ok == true and .duplicate == false and .submissionId == $id' <<<"$response" >/dev/null
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"

      - name: Confirmar diretamente no D1
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.register.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          payload=$(jq -n --arg id "$SUBMISSION_ID" \
            '{sql:"SELECT submission_id FROM leads WHERE submission_id = ? LIMIT 1",params:[$id]}')
          response=$(curl --fail-with-body -sS -X POST "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$payload")
          jq -e --arg id "$SUBMISSION_ID" \
            '.success == true and (.result[0].results | length) == 1 and .result[0].results[0].submission_id == $id' \
            <<<"$response" >/dev/null

      - name: Limpar cadastro de teste
        if: always() && steps.register.outputs.submission_id != ''
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.register.outputs.submission_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          payload=$(jq -n --arg id "$SUBMISSION_ID" \
            '{sql:"DELETE FROM leads WHERE submission_id = ?",params:[$id]}')
          response=$(curl --fail-with-body -sS -X POST "$api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$payload")
          jq -e '.success == true' <<<"$response" >/dev/null
          echo "PASS: formulario + Worker + D1"
