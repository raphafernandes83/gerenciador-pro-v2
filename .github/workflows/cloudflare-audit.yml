name: Cloudflare audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-audit.yml"
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/cloudflare-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      WORKER_NAME: gerenciador-pro-v2
    steps:
      - name: Auditar acesso Cloudflare
        id: audit
        shell: bash
        run: |
          set +e
          failed=0
          {
            echo "### Cloudflare API audit"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
          } > cloudflare-audit-report.md

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "- ❌ CLOUDFLARE_API_TOKEN ausente." >> cloudflare-audit-report.md
            failed=1
          else
            verify=$(curl -sS \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            if [ $? -eq 0 ] && [ "$(jq -r '.success // false' <<<"$verify")" = "true" ]; then
              echo "- ✅ Token aceito pela Cloudflare." >> cloudflare-audit-report.md
            else
              echo "- ❌ Token rejeitado pela Cloudflare." >> cloudflare-audit-report.md
              jq -r '.errors[]? | "  - erro " + ((.code // "?")|tostring) + ": " + (.message // "sem mensagem")' <<<"$verify" >> cloudflare-audit-report.md
              failed=1
            fi

            response=$(curl -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            if [ $? -ne 0 ] || [ "$(jq -r '.success // false' <<<"$response")" != "true" ]; then
              echo "- ❌ Token nao conseguiu listar Workers." >> cloudflare-audit-report.md
              jq -r '.errors[]? | "  - erro " + ((.code // "?")|tostring) + ": " + (.message // "sem mensagem")' <<<"$response" >> cloudflare-audit-report.md
              failed=1
            else
              echo "- ✅ Listagem de Workers autorizada." >> cloudflare-audit-report.md
              tag=$(jq -r --arg name "$WORKER_NAME" '.result[]? | select(.id == $name) | .tag' <<<"$response" | head -n1)
              if [ -z "$tag" ] || [ "$tag" = "null" ]; then
                echo "- ❌ Worker \`${WORKER_NAME}\` nao encontrado." >> cloudflare-audit-report.md
                failed=1
              else
                echo "- ✅ Worker \`${WORKER_NAME}\` encontrado pela API." >> cloudflare-audit-report.md

                triggers=$(curl -sS \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${tag}/triggers" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
                if [ $? -ne 0 ] || [ "$(jq -r '.success // false' <<<"$triggers")" != "true" ]; then
                  echo "- ❌ Token nao conseguiu consultar Workers Builds triggers." >> cloudflare-audit-report.md
                  jq -r '.errors[]? | "  - erro " + ((.code // "?")|tostring) + ": " + (.message // "sem mensagem")' <<<"$triggers" >> cloudflare-audit-report.md
                  failed=1
                else
                  count=$(jq '.result | length' <<<"$triggers")
                  echo "- ✅ Workers Builds acessivel: ${count} trigger(s)." >> cloudflare-audit-report.md
                  jq -r '.result[]? | "  - `" + (.trigger_name // "sem nome") + "`: includes=`" + ((.branch_includes // []) | join(",")) + "`, excludes=`" + ((.branch_excludes // []) | join(",")) + "`, deploy=`" + (.deploy_command // "") + "`"' <<<"$triggers" >> cloudflare-audit-report.md
                fi
              fi
            fi
          fi

          echo >> cloudflare-audit-report.md
          if [ "$failed" -eq 0 ]; then
            echo "**Resultado: PASS — acesso programatico pronto.**" >> cloudflare-audit-report.md
          else
            echo "**Resultado: FAIL — nenhuma alteracao foi feita na Cloudflare.**" >> cloudflare-audit-report.md
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar status legivel por API
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.audit.outputs.failed }}" = "0" ]; then
            state=success
            description="Cloudflare API audit PASS"
          else
            state=failure
            description="Cloudflare API audit FAIL"
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="cloudflare/api-audit" \
            -f description="$description"

      - name: Registrar resultado no PR de infraestrutura
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat cloudflare-audit-report.md)
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/14/comments" \
            -f body="$body"

      - name: Encerrar com estado da auditoria
        if: steps.audit.outputs.failed == '1'
        shell: bash
        run: exit 1
