name: Cloudflare audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-audit.yml"
      - "migrations/**"
      - "src/**"
      - "wrangler.jsonc"
  push:
    branches:
      - "infra/cloudflare-foundation"
    paths:
      - ".github/workflows/cloudflare-audit.yml"
      - "migrations/**"
      - "src/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      BOOTSTRAP_BUILD_UUID: 69fbbd6b-de5d-4e22-b0e5-168641be3394
    steps:
      - name: Auditar token e Workers Builds
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Token ausente"; exit 1; }
          verify=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$verify")" = "true"
          build=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/builds/${BOOTSTRAP_BUILD_UUID}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          tag=$(jq -r '.result.trigger.external_script_id // empty' <<<"$build")
          test -n "$tag"
          triggers=$(curl --fail-with-body -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${tag}/triggers" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(jq -r '.success // false' <<<"$triggers")" = "true"
          prod_ok=$(jq -r '[.result[] | select(.deploy_command == "npx wrangler deploy") | .branch_includes] | any(. == ["production"])' <<<"$triggers")
          preview_ok=$(jq -r '[.result[] | select(.deploy_command == "npx wrangler versions upload") | .branch_excludes] | any(. == ["production"])' <<<"$triggers")
          test "$prod_ok" = "true" && test "$preview_ok" = "true"
          echo "PASS: Cloudflare token + Builds + branch control"

  d1:
    needs: audit
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ae08d3699ea3659100fe4ac443e79d9
      D1_NAME: gerenciador-pro-leads
    steps:
      - uses: actions/checkout@v4

      - name: Criar ou localizar D1
        id: db
        shell: bash
        run: |
          set -euo pipefail
          databases=$(npx --yes wrangler@latest d1 list --json)
          database_id=$(jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' <<<"$databases" | head -n1)
          if [ -z "$database_id" ] || [ "$database_id" = "null" ]; then
            echo "Criando D1 ${D1_NAME}..."
            npx --yes wrangler@latest d1 create "$D1_NAME" --location enam
            databases=$(npx --yes wrangler@latest d1 list --json)
            database_id=$(jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' <<<"$databases" | head -n1)
          fi
          test -n "$database_id" && test "$database_id" != "null"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "PASS: D1 id ${database_id}"

      - name: Aplicar schema no D1 remoto
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute "$D1_NAME" --remote --file=./migrations/0001_leads.sql

      - name: Validar schema
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx --yes wrangler@latest d1 execute "$D1_NAME" --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('leads','system_events') ORDER BY name;" --json)
          leads_ok=$(jq -r '[.[].results[]?.name] | index("leads") != null' <<<"$result")
          events_ok=$(jq -r '[.[].results[]?.name] | index("system_events") != null' <<<"$result")
          test "$leads_ok" = "true" && test "$events_ok" = "true"
          echo "PASS: leads + system_events"

      - name: Registrar D1 no PR
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_ID: ${{ steps.db.outputs.database_id }}
        run: |
          body=$(printf '### D1 criado e validado\n\n✅ `%s` pronto.\n✅ Tabelas `leads` e `system_events` prontas.\n✅ Database ID: `%s`.\n\nPróximo: vincular D1 ao Worker e testar `/api/register` no preview.' "$D1_NAME" "$DATABASE_ID")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
